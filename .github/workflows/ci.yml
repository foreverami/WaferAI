# 자동 테스트 — main 에 push 하거나 PR 을 열면 돈다.
#
# 모델 가중치(약 107MB)는 저장소에 없다. 그래서 같은 구조의 무작위 가중치 모델을 그 자리에서
# 만들어(scripts/make_stand_in_model.py) API · 인증 · DB 경로를 실제로 돌린다. 학습된 모델이어야
# 뜻이 있는 테스트(Grad-CAM 이 결함 위치를 가리키는지)는 WAFERAI_STAND_IN_MODEL=1 로 건너뛴다.
# 그 테스트는 실제 모델이 있는 개발 장비에서 돈다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 push 하면 앞선 실행을 취소한다 (비공개 저장소는 실행 시간이 월 한도에 잡힌다)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 테스트 (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      # sqlite 실행에서도 뜨지만 쓰지 않는다. 서비스는 조건부로 띄울 수 없어서다.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: waferai_test
          POSTGRES_HOST_AUTH_METHOD: trust      # CI 전용 일회성 DB
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WAFERAI_STAND_IN_MODEL: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'        # Dockerfile 의 python:3.13 과 같게
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 의존성 설치
        # torch 는 CPU 전용 인덱스에서 먼저 받는다. PyPI 기본 휠은 CUDA 라이브러리를 수 GB 끌고 온다.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-dev.txt

      - name: 대역 모델 생성
        run: python -m scripts.make_stand_in_model

      - name: PostgreSQL 연결 설정
        if: matrix.database == 'postgresql'
        # 마이그레이션 테스트는 스키마를 지웠다 다시 만들므로 앱 테스트와 다른 DB 를 쓴다
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE waferai_migrate'
          echo "WAFERAI_TEST_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/waferai_test" >> "$GITHUB_ENV"
          echo "WAFERAI_TEST_MIGRATION_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/waferai_migrate" >> "$GITHUB_ENV"

      - name: 테스트
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'            # frontend/Dockerfile 의 node:22 와 같게
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix frontend

      - name: 린트
        run: npm --prefix frontend run lint

      - name: 빌드
        run: npm --prefix frontend run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: CSP 검사 — 빌드 결과에 인라인 스크립트가 없는지
        # Nginx 의 CSP 가 script-src 'self' 라 인라인 스크립트가 생기면 화면이 빈 채로 멈춘다
        run: |
          pip install PyYAML
          python -m unittest tests.test_deploy.FrontendBuildTests -v

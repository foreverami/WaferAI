# 보안 헤더 — default.conf / https.conf 의 server 와, add_header 를 따로 쓰는 모든
# location 에서 include 한다.
#
# 왜 파일로 빼는가: Nginx 의 add_header 는 현재 블록에 add_header 가 하나라도 있으면
# 상위 블록의 것을 물려받지 않는다. location 에서 Cache-Control 만 추가해도 서버 레벨의
# 보안 헤더가 조용히 사라진다. tests/test_deploy.py 가 이 누락을 검사한다.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 스크립트·스타일·이미지·요청을 모두 같은 출처로만 제한한다.
# 빌드 결과에 인라인 스크립트가 없어서 script-src 를 'self' 로 묶을 수 있다.
# 화면에서 인라인 <script> 나 외부 CDN 을 쓰기 시작하면 여기를 같이 고쳐야 한다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

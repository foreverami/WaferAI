# WaferAI 배포 구성 — db(PostgreSQL) · api(FastAPI) · web(Nginx)
#
#   cd deploy
#   cp .env.example .env        # 값을 채운다
#   docker compose up -d --build
#
# compose 를 저장소 최상위가 아니라 deploy/ 에 두는 이유: docker compose 는 같은 폴더의
# .env 를 읽는다. 최상위에 두면 로컬 개발용 .env 와 같은 파일을 쓰게 되어, 운영 설정
# (WAFERAI_ENV=production)이 개발 서버까지 PostgreSQL 을 요구하게 된다.

name: waferai

x-logging: &logging
  # 기본 로그 드라이버는 크기 제한이 없어 디스크를 다 채울 수 있다.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waferai
      POSTGRES_DB: waferai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waferai -d waferai"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    # ports 를 열지 않는다. api 만 내부 네트워크로 접근하고 밖에서는 닿지 않는다.

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: waferai-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WAFERAI_ENV: production
      # 비밀번호는 URL 에 들어가므로 영문·숫자·-·_ 만 쓴다 (.env.example 의 생성 명령 참고).
      WAFERAI_DATABASE_URL: postgresql+psycopg://waferai:${POSTGRES_PASSWORD}@db:5432/waferai
      WAFERAI_SECRET_KEY: ${WAFERAI_SECRET_KEY:?deploy/.env 에 WAFERAI_SECRET_KEY 를 넣으세요}
      WAFERAI_COOKIE_SECURE: ${WAFERAI_COOKIE_SECURE:-true}
      WAFERAI_BACKEND: ${WAFERAI_BACKEND:-auto}
    volumes:
      # 가중치는 이미지에 넣지 않고 읽기 전용으로 붙인다.
      - ../models:/app/models:ro
      # 히트맵은 지연 생성 결과라 지워져도 다시 만들어지지만, 재기동마다 다시 만들면 느리다.
      - heatmaps:/app/data/heatmaps
    healthcheck:
      # slim 이미지에는 curl 이 없어 파이썬으로 확인한다.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 기동 시 모델 적재와 마이그레이션이 있어 여유를 둔다.
      start_period: 90s
    logging: *logging
    # ports 를 열지 않는다. Nginx 만 접근한다.

  web:
    build:
      context: ../frontend
    image: waferai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # HTTPS 인증서 발급 확인용 (https 전환 전에도 필요)
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

volumes:
  pgdata:
  heatmaps:

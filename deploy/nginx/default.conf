# WaferAI — HTTP 설정.
# 로컬 확인과, HTTPS 인증서를 처음 받을 때 쓴다. 인증서를 받은 뒤에는 https.conf 로 바꾼다.

server {
    listen 80;
    server_name _;

    # 업로드 상한. 앱의 8MB 제한보다 커야 한다. 더 작으면 Nginx 가 먼저 HTML 413 을
    # 돌려줘서 화면이 JSON 오류 메시지를 읽지 못한다. multipart 경계 여유로 2MB 더 준다.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내장 DNS. proxy_pass 에 변수를 쓰면 요청 때마다 이름을 다시 찾는다.
    # 상수로 적으면 Nginx 가 기동 시 한 번만 해석해서, api 컨테이너가 재시작해 IP 가
    # 바뀌면 502 가 계속 난다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Let's Encrypt 인증서 발급 확인용. HTTPS 를 켜기 전에 여기로 응답해야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 첫 히트맵은 모델 적재와 역전파가 함께 일어나 CPU 서버에서 수십 초가 걸릴 수 있다.
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass $api_upstream;
        access_log off;
    }

    # 파일명에 내용 해시가 붙어 있어, 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 화면 라우팅. /review 나 /settings 에서 새로고침해도 index.html 을 준다.
    # 이게 없으면 브라우저가 서버에 /review 를 직접 요청해 404 가 난다.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html 은 매번 확인하게 한다. 캐시되면 배포 후에도 옛 화면이 뜬다.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
